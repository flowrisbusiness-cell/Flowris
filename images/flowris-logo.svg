<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" width="100%" height="100%">
  <defs>
    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="crestCircle">
      <circle cx="46" cy="45" r="38" />
    </clipPath>
  </defs>

  <!-- Botanical Emblem: Real Flower in Circular Crest -->
  <g filter="url(#cleanShadow)">
    <circle cx="46" cy="45" r="38" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5" />
    <circle cx="46" cy="45" r="35" fill="#FAF5FF" opacity="0.6" stroke="#DDD6FE" stroke-width="0.8" />
    
    <g clip-path="url(#crestCircle)">
      <image href="data:image/png;base64," x="15" y="14" width="62" height="62" />
    </g>
  </g>

  <!-- BRAND WORDMARK "Flowris" -->
  <text x="100" y="52" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="700" fill="#111827" letter-spacing="-0.5">Flowris</text>

  <!-- Single Elegant Rose Petal Accent over 'i' -->
  <circle cx="216" cy="27" r="4.2" fill="#EC4899" />
  <circle cx="216" cy="27" r="2.2" fill="#FDA4AF" />
  <circle cx="216" cy="27" r="1.0" fill="#FFE4E6" />

  <!-- SUBTITLE TAGLINE -->
  <text x="102" y="72" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9.5" font-weight="700" fill="#7C3AED" letter-spacing="2.6">ARTISANAL GIFTS &amp; BOTANICAL KEEPSAKES</text>
</svg>