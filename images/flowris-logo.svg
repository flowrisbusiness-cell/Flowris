<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="luxeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Botanical Emblem: Real Stem / Stick with Organic Leaves & Blooming Rose/Botanical Petals -->
  <g transform="translate(6, 6)" filter="url(#luxeShadow)">
    <circle cx="34" cy="34" r="32" fill="#FFFFFF" stroke="#F3E8FF" stroke-width="1.5" />
    <circle cx="34" cy="34" r="30" fill="#FAF5FF" opacity="0.6" />

    <!-- The Natural Botanical Stick / Stem -->
    <path d="M22 56 Q28 44 32 30 Q33 24 35 17" fill="none" stroke="url(#stemGrad)" stroke-width="2.6" stroke-linecap="round" />
    
    <!-- Realistic side twigs / shoots -->
    <path d="M26 46 Q22 41 18 42" fill="none" stroke="url(#stemGrad)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M30 36 Q38 34 43 37" fill="none" stroke="url(#stemGrad)" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Delicate natural leaves along the stem -->
    <path d="M18 42 C16 37 19 33 23 35 C23 39 21 42 18 42 Z" fill="#7C3AED" opacity="0.9" />
    <path d="M43 37 C47 34 47 30 43 28 C40 31 40 35 43 37 Z" fill="#9333EA" opacity="0.85" />
    <path d="M28 32 C26 27 28 23 31 25 C31 29 29 32 28 32 Z" fill="#A855F7" opacity="0.75" />

    <!-- Blooming Floral Head -->
    <path d="M35 17 C28 11 31 4 37 9 C43 4 46 11 39 17 Z" fill="url(#petalGrad)" />
    <path d="M35 17 C28 16 26 22 31 25 C35 23 35 19 35 17 Z" fill="#F43F5E" opacity="0.9" />
    <path d="M39 17 C46 16 48 22 43 25 C39 23 39 19 39 17 Z" fill="#EC4899" opacity="0.9" />
    <ellipse cx="37" cy="14" rx="4" ry="5" fill="#BE185D" />
    <circle cx="37" cy="13" r="2.2" fill="url(#goldGrad)" />
    <circle cx="35.5" cy="11.5" r="1" fill="#FFFFFF" />

    <!-- Tiny artisan sparkle -->
    <path d="M52 14 L53 16.5 L55.5 17.5 L53 18.5 L52 21 L51 18.5 L48.5 17.5 L51 16.5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography: "Flowris" with LOVE HEART as the dot of 'i' -->
  <text x="82" y="45" font-family="'Playfair Display', Georgia, serif" font-size="33" font-weight="700" fill="#111827" letter-spacing="-0.3">Flowr</text>
  <text x="176.5" y="45" font-family="'Playfair Display', Georgia, serif" font-size="33" font-weight="700" fill="#111827">&#305;</text>
  <text x="189" y="45" font-family="'Playfair Display', Georgia, serif" font-size="33" font-weight="700" fill="#111827" letter-spacing="-0.3">s</text>

  <!-- LOVE HEART ICON as dot of 'i' -->
  <g transform="translate(181.5, 22.5) scale(0.68)">
    <path d="M0 -3 C-2 -7, -7 -6, -7 -2 C-7 2, -2 5, 0 8 C2 5, 7 2, 7 -2 C7 -6, 2 -7, 0 -3 Z" fill="url(#petalGrad)" />
  </g>

  <!-- Subtitle Tagline (NO DHAKA) -->
  <text x="84" y="61" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="600" fill="#7C3AED" letter-spacing="3.2">HANDCRAFTED GIFTS, MADE WITH LOVE</text>
</svg>
