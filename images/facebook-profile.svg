<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF2F8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="fbStemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="fbPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="fbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#7C3AED" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Outer Luxurious Concentric Circle Rings -->
  <circle cx="400" cy="400" r="370" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.4" />
  <circle cx="400" cy="400" r="350" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="400" cy="400" r="348" fill="#FAF5FF" opacity="0.5" />

  <!-- Central Botanical Emblem: Natural Stick & Flower -->
  <g transform="translate(400, 290) scale(3.4)">
    <!-- Natural Stem / Twig -->
    <path d="M-8 44 Q-2 28 2 12 Q3 5 5 -4" fill="none" stroke="url(#fbStemGrad)" stroke-width="2.6" stroke-linecap="round" />
    
    <!-- Side twigs -->
    <path d="M-4 32 Q-9 27 -14 28" fill="none" stroke="url(#fbStemGrad)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M0 20 Q8 18 13 21" fill="none" stroke="url(#fbStemGrad)" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Delicate natural leaves -->
    <path d="M-14 28 C-16 23 -13 19 -9 21 C-9 25 -11 28 -14 28 Z" fill="#7C3AED" />
    <path d="M13 21 C17 18 17 14 13 12 C10 15 10 19 13 21 Z" fill="#9333EA" />

    <!-- Blooming Floral Head -->
    <path d="M5 -4 C-2 -10 1 -17 7 -12 C13 -17 16 -10 9 -4 Z" fill="url(#fbPetalGrad)" />
    <path d="M5 -4 C-2 -5 -4 1 1 4 C5 2 5 -2 5 -4 Z" fill="#F43F5E" />
    <path d="M9 -4 C16 -5 18 1 13 4 C9 2 9 -2 9 -4 Z" fill="#EC4899" />
    
    <ellipse cx="7" cy="-7" rx="4" ry="5" fill="#BE185D" />
    <circle cx="7" cy="-8" r="2.2" fill="url(#fbGoldGrad)" />

    <!-- Artisan Sparkle -->
    <path d="M22 -8 L23 -5.5 L25.5 -4.5 L23 -3.5 L22 -1 L21 -3.5 L18.5 -4.5 L21 -5.5 Z" fill="url(#fbGoldGrad)" />
  </g>

  <!-- Typography: Flowris with Love-Heart as Dot of 'i' -->
  <g transform="translate(400, 560)">
    <!-- Main Wordmark centered -->
    <text x="-95" y="0" font-family="'Playfair Display', Georgia, serif" font-size="76" font-weight="700" fill="#111827" letter-spacing="-1">Flowr</text>
    <text x="110" y="0" font-family="'Playfair Display', Georgia, serif" font-size="76" font-weight="700" fill="#111827">&#305;</text>
    <text x="136" y="0" font-family="'Playfair Display', Georgia, serif" font-size="76" font-weight="700" fill="#111827" letter-spacing="-1">s</text>

    <!-- Love Heart dot on 'i' -->
    <g transform="translate(120, -50) scale(1.6)">
      <path d="M0 -3 C-2 -7, -7 -6, -7 -2 C-7 2, -2 5, 0 8 C2 5, 7 2, 7 -2 C7 -6, 2 -7, 0 -3 Z" fill="url(#fbPetalGrad)" />
    </g>

    <!-- Tagline (DHAKA REMOVED) -->
    <text x="0" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="19" font-weight="700" fill="#7C3AED" letter-spacing="7">HANDCRAFTED GIFTS</text>
    <text x="0" y="74" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#6B7280">Made with Love</text>
  </g>
</svg>
