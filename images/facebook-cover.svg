<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 924" width="1640" height="924">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF2F8" />
    </linearGradient>

    <!-- Natural Wood Twig Gradient -->
    <linearGradient id="cWood" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4A3B32" />
      <stop offset="40%" stop-color="#6B4F3B" />
      <stop offset="80%" stop-color="#8B5E3C" />
      <stop offset="100%" stop-color="#5C4033" />
    </linearGradient>

    <!-- Botanical Leaf Gradients -->
    <linearGradient id="cLeaf1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A2F" />
      <stop offset="50%" stop-color="#2D5A46" />
      <stop offset="100%" stop-color="#4E876A" />
    </linearGradient>
    <linearGradient id="cLeaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E876A" />
      <stop offset="60%" stop-color="#2D5A46" />
      <stop offset="100%" stop-color="#1A3328" />
    </linearGradient>

    <!-- Real Velvet Rose Petals -->
    <linearGradient id="cPetalDeep" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="50%" stop-color="#9D174D" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="cPetalMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="cPetalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="cPetalCup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="cGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Standard SVG Blur and Shadow Filters -->
    <filter id="softGlowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="softGlowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#7C3AED" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1640" height="924" fill="url(#cBg)" />

  <!-- Ambient Luxury Glow Orbs (Valid feGaussianBlur filter) -->
  <circle cx="200" cy="180" r="280" fill="#F3E8FF" opacity="0.6" filter="url(#softGlowPurple)" />
  <circle cx="1480" cy="300" r="340" fill="#FCE7F3" opacity="0.6" filter="url(#softGlowPink)" />
  <circle cx="820" cy="850" r="380" fill="#FAF5FF" opacity="0.7" filter="url(#softGlowPurple)" />

  <!-- Subtle Decorative Outer Border Frame -->
  <rect x="40" y="40" width="1560" height="844" rx="36" fill="none" stroke="#F3E8FF" stroke-width="2" />
  <rect x="52" y="52" width="1536" height="820" rx="30" fill="none" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Left Main Brand Showcase -->
  <g transform="translate(130, 140)">
    
    <!-- Top Header: Botanical Emblem & Brand Name -->
    <g transform="translate(0, 0)">
      
      <!-- Emblem Crest: Realistic Flower on Wooden Stick -->
      <g transform="translate(0, 0)">
        <circle cx="56" cy="56" r="54" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2" filter="url(#cardShadow)" />
        <circle cx="56" cy="56" r="49" fill="#FAF5FF" opacity="0.6" />
        
        <g transform="translate(56, 56) scale(2.0)">
          <!-- Wood stick -->
          <path d="M-8 25 C-6 17, -1 10, 4 2 C5.5 -2, 6.5 -5, 7 -9" fill="none" stroke="url(#cWood)" stroke-width="3" stroke-linecap="round" />
          <path d="M-7.5 24 C-5.5 17, -0.8 10.5, 4.2 2.5" fill="none" stroke="#A27B5C" stroke-width="1" stroke-linecap="round" opacity="0.75" />

          <!-- Twigs -->
          <path d="M-4.5 15 C-8 12, -12 13, -15 15" fill="none" stroke="url(#cWood)" stroke-width="1.8" stroke-linecap="round" />
          <path d="M0.5 7 C5 5, 9 6, 13 9" fill="none" stroke="url(#cWood)" stroke-width="1.6" stroke-linecap="round" />

          <!-- Botanical Leaves -->
          <g transform="translate(-15, 15)">
            <path d="M0 0 C-4 -6, -1 -12, 5 -10 C9 -7, 6 0, 0 0 Z" fill="url(#cLeaf1)" />
            <path d="M0 0 C1 -4, 2 -7, 4 -9" fill="none" stroke="#6EE7B7" stroke-width="0.6" opacity="0.8" />
          </g>
          <g transform="translate(13, 9)">
            <path d="M0 0 C5 -4, 6 -10, 1 -11 C-3 -11, -3 -4, 0 0 Z" fill="url(#cLeaf2)" />
            <path d="M0 0 C2 -4, 2 -7, 1 -10" fill="none" stroke="#6EE7B7" stroke-width="0.6" opacity="0.8" />
          </g>

          <!-- Flower Head -->
          <path d="M3 -6 C1 -9, 0 -12, 2 -13 C4 -10, 4 -8, 3 -6 Z" fill="#1E3A2F" />
          <path d="M11 -6 C13 -9, 14 -12, 12 -13 C10 -10, 10 -8, 11 -6 Z" fill="#1E3A2F" />

          <path d="M7 -8 C-2 -10, -6 -18, 1 -21 C7 -23, 9 -17, 7 -8 Z" fill="url(#cPetalDeep)" />
          <path d="M7 -8 C16 -10, 20 -18, 13 -21 C7 -23, 5 -17, 7 -8 Z" fill="url(#cPetalDeep)" />

          <path d="M-1 -12 C-4 -16, 0 -22, 7 -20 C3 -16, 2 -13, -1 -12 Z" fill="url(#cPetalMid)" />
          <path d="M15 -12 C18 -16, 14 -22, 7 -20 C11 -16, 12 -13, 15 -12 Z" fill="url(#cPetalMid)" />

          <path d="M0 -15 C1 -20, 13 -20, 14 -15 C13 -10, 1 -10, 0 -15 Z" fill="url(#cPetalLight)" />
          <path d="M2.5 -16 C3.5 -19.5, 10.5 -19.5, 11.5 -16 C9.5 -13, 4.5 -13, 2.5 -16 Z" fill="url(#cPetalCup)" />

          <!-- Center Stamen -->
          <circle cx="7" cy="-16.8" r="1.3" fill="url(#cGold)" />
        </g>
      </g>

      <!-- Main Wordmark "Flowris" -->
      <g transform="translate(136, 68)">
        <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="82" font-weight="700" fill="#111827" letter-spacing="-1">Flowr</text>
        <text x="228" y="0" font-family="'Playfair Display', Georgia, serif" font-size="82" font-weight="700" fill="#111827">&#305;</text>
        <text x="257" y="0" font-family="'Playfair Display', Georgia, serif" font-size="82" font-weight="700" fill="#111827" letter-spacing="-1">s</text>

        <!-- Rose Petal dot on 'i' -->
        <g transform="translate(242, -52) rotate(15)">
          <path d="M0 0 C-4 -6, -2 -13, 4 -15 C8 -11, 8 -4, 0 0 Z" fill="url(#cPetalLight)" />
          <circle cx="2.5" cy="-8" r="1.6" fill="#FDA4AF" />
        </g>

        <!-- Subtitle Tagline -->
        <text x="4" y="38" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" letter-spacing="6">ARTISANAL GIFTS &amp; BOTANICAL KEEPSAKES</text>
      </g>
    </g>

    <!-- Headline: Sophisticated Brand Statement -->
    <text x="0" y="215" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="600" fill="#1F2937">
      Artisanal Gifts, <tspan fill="#EC4899" font-style="italic">Timelessly Crafted.</tspan>
    </text>

    <text x="0" y="265" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="19" fill="#4B5563" font-weight="400">
      Botanical Resin Keepsakes • Preserved Floral Bouquets • Custom Spotify Plaques • Curated Hampers
    </text>

    <!-- Product Category Pills Row -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="220" height="46" rx="23" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5" />
      <text x="110" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#6B21A8">✨ Resin Art</text>

      <rect x="236" y="0" width="250" height="46" rx="23" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="1.5" />
      <text x="361" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#9D174D">🌸 Preserved Flowers</text>

      <rect x="502" y="0" width="250" height="46" rx="23" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5" />
      <text x="627" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#3730A3">🎵 Spotify Plaques</text>

      <rect x="768" y="0" width="220" height="46" rx="23" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.5" />
      <text x="878" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#92400E">🎁 Luxury Hampers</text>
    </g>

    <!-- Three High-Trust Value Pillars (Delivery, Advance Policy, WhatsApp) -->
    <g transform="translate(0, 395)">
      
      <!-- Card 1: Fast 2-3 Days Delivery & ৳60 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="310" height="126" rx="22" fill="#FFFFFF" stroke="#F3E8FF" stroke-width="1.5" filter="url(#cardShadow)" />
        <circle cx="48" cy="63" r="26" fill="#F5F3FF" />
        <text x="48" y="71" text-anchor="middle" font-size="26">🚚</text>
        <text x="92" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#1F2937">2-3 Days Delivery</text>
        <text x="92" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#7C3AED">Flat ৳60 Delivery Charge</text>
        <text x="92" y="97" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#10B981">FREE on orders > ৳2,999</text>
      </g>

      <!-- Card 2: Cash on Delivery & 30% Custom Advance Policy -->
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="330" height="126" rx="22" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="1.5" filter="url(#cardShadow)" />
        <circle cx="48" cy="63" r="26" fill="#FDF2F8" />
        <text x="48" y="71" text-anchor="middle" font-size="26">💳</text>
        <text x="92" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#1F2937">Cash on Delivery</text>
        <text x="92" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#4B5563">100% COD for Ready Items</text>
        <text x="92" y="97" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#EC4899">30% Advance for Custom Items</text>
      </g>

      <!-- Card 3: WhatsApp Ordering Hotline -->
      <g transform="translate(680, 0)">
        <rect x="0" y="0" width="310" height="126" rx="22" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5" filter="url(#cardShadow)" />
        <circle cx="48" cy="63" r="26" fill="#ECFDF5" />
        <text x="48" y="71" text-anchor="middle" font-size="26">💬</text>
        <text x="92" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#065F46">WhatsApp / Hotline</text>
        <text x="92" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#047857">01886338064</text>
        <text x="92" y="97" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#6B7280">Instant Replies &amp; Inquiries</text>
      </g>

    </g>

  </g>

  <!-- Right Side Luxury Seal / Quality Crest -->
  <g transform="translate(1290, 240)">
    <circle cx="120" cy="120" r="140" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2" filter="url(#cardShadow)" />
    <circle cx="120" cy="120" r="128" fill="#FAF5FF" opacity="0.7" />
    <circle cx="120" cy="120" r="118" fill="none" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="5 5" />
    
    <text x="120" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="4">ORIGINAL</text>
    <text x="120" y="125" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="700" fill="#111827">100%</text>
    <text x="120" y="154" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#EC4899">Handcrafted</text>
    <text x="120" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="2">AUTHENTIC QUALITY</text>
  </g>
</svg>